[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-nexus"
version = "0.1.0"
description = "Autonomous Agent Dynamic Red-Teaming, Indirect Prompt Injection Auditor & Runtime Defense Suite."
readme = "README.md"
authors = [
  { name = "Ahmed Hassan", email = "ahmed@a2zsoc.com" }
]
license = { text = "Apache-2.0" }
keywords = [
  "agent-red-teaming",
  "jailbreak-llm",
  "indirect-prompt-injection",
  "owasp-llm-top-10",
  "prompt-injection-defense",
  "tool-hijacking",
  "mcp-security",
  "adversarial-ai",
  "ai-safety",
  "model-inversion",
  "promptfoo-alternative",
  "ai-pentesting"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adversarial-nexus = "adversarial_nexus.cli:main"
